[project]
name = "persist"
version = "0.1.0"
description = "Persist — plant breeding data management for perennial crops (Django)"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0,<6.1",
    "djangorestframework>=3.15",
    "django-filter>=24.3",
    "django-environ>=0.11",
    "django-extensions>=3.2",
    "psycopg[binary]>=3.2",
    "django-prefix-id>=1.0.1",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=4.4",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "persist.settings.test"
python_files = ["test_*.py", "tests.py"]
addopts = "--reuse-db"
