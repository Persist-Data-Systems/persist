name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check --diff .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: persist
          POSTGRES_USER: persist
          POSTGRES_PASSWORD: persist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U persist -d persist"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: persist.settings.test
      DJANGO_SECRET_KEY: ci-insecure-key
      DJANGO_DEBUG: "False"
      DJANGO_USE_GIS: "True"
      DATABASE_URL: postgres://persist:persist@localhost:5432/persist

    steps:
      - uses: actions/checkout@v4

      # GeoDjango talks to these system libs via ctypes (no Python GDAL package).
      - name: Install GDAL / GEOS / PROJ
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gdal-bin libgdal-dev libgeos-dev libproj-dev

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Django system checks
        run: uv run python manage.py check

      - name: Run tests
        run: uv run pytest -q
