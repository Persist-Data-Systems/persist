services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: persist
      POSTGRES_USER: persist
      POSTGRES_PASSWORD: persist
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U persist -d persist"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
